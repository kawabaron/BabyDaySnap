name: BSnap
options:
  bundleIdPrefix: com.kawabaron.bsnap
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
targets:
  BSnap:
    type: application
    platform: iOS
    sources:
      - path: Sources/BSnapApp
      - path: ../assets/fonts
        type: folder
      - path: ../assets/images
        type: folder
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: BSnap
        CFBundleIdentifier: com.kawabaron.bsnap.app
        CFBundleShortVersionString: "1.13"
        CFBundleVersion: "1"
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Allow camera access to take baby photos.
        NSPhotoLibraryUsageDescription: Allow photo access to import baby photos.
        NSPhotoLibraryAddUsageDescription: Allow photo library access to save edited photos.
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kawabaron.bsnap.app
        INFOPLIST_FILE: Supporting/Info.plist
    dependencies:
      - sdk: libsqlite3.tbd
